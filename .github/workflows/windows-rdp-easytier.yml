name: Windows Cloud RDP (EasyTier Secure)

# ============================================================================
# v8 变更（相对 v7）
# ----------------------------------------------------------------------------
# 【1】移除 --enable-exit-node 与 --enable-kcp-proxy
#   全网设备统一改走「SOCKS5 门户」（socks5h://192.168.110.88:1080），
#   运行器不再承担出口节点与 KCP 代理。二者正是本机最重的两项负担：
#     - exit node ：要替其它设备做全量转发（NAT 网关角色）
#     - kcp proxy ：UDP 侧 CPU 密集型代理
#   2026-09-23 的 #33 运行在第 5 步保活途中被平台判定
#   "The hosted runner lost communication with the server"，官方注解点名
#   两类成因：CPU/内存饥饿、网络访问被阻断。本次减负直接针对前者。
#
# 【2】新增「运行器自身出网基线自检」，把静默失联变成启动即失败
#   - 用 Find-NetRoute 判定访问 8.8.8.8 的【有效】出接口。若落到虚拟网卡
#     （默认路由被 TUN 接管 → 形成回环 → 掐断 runner 与 GitHub 的连接）：
#     先尝试删除 TUN 上的 0.0.0.0/0，复查仍被接管则中止并输出 core 日志。
#     注意：v7 直接扫 Get-NetRoute 里是否存在虚拟网卡条目会误报 ——
#     EasyTier 的 TUN 本来就可能挂着一条 metric 9005 的 0.0.0.0/0，
#     只要物理网卡的有效优先级仍胜出就无害，必须看「有效出接口」而非「是否存在」。
#   - 显式验证 api.github.com:443 可达，不通即中止（避免跑到 4 小时后才发现）。
#
# 【3】easytier-core 进程优先级设为 BelowNormal，保证 Actions 心跳不被抢占。
#
# 【4】外部心跳（可选）：每 5 分钟 POST 一次运行状态到 secrets.HEARTBEAT_URL
#   （未配置则自动跳过）。runner 一旦被平台带走，Actions 日志会整体消失
#   （日志下载接口需认证，事后无法取证），只有外部心跳能留下死亡前的最后状态。
#   载荷示例：{"ts":...,"event":"tick","peers":..,"restarts":..,"socks5_listen":..,
#             "egress_if":"Ethernet","gh_reachable":true,"mem_mb":..}
#   事件类型：startup / tick / peer_anomaly / egress_changed / core_restarted /
#             portal_down / github_unreachable / graceful_stop
#
# 【5】不做提前收尾（v8.1）：保活循环直接跑满 360 分钟，由平台在 6 小时
#   上限处结束作业。运行结论会是 cancelled，属预期行为，不代表故障。
#
# 【客户端配置（v8）】
#   出口节点   : 留空          <- 本工作流已不再提供出口节点
#   自定义路由 : 留空          <- 关键！不要再填 0.0.0.0/0
#   代理       : SOCKS5 / socks5h -> 192.168.110.88:1080（无用户名密码）
#
# 【v7 保留项】--socks5 门户；防火墙把 1080/3389 的入站来源限定在 192.168.110.0/24。
# 【v6 保留项】单步骤持有 easytier-core（启动→就绪→自检→保活同一步骤），
#   避免核心进程跨步骤被回收；诊断默认非致命（出网基线自检除外，见【2】）。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: '会话时长（1-6 小时，GitHub 硬上限 6 小时）'
        required: false
        default: '6'

env:
  ET_VIRTUAL_IP: 192.168.110.88
  ET_NETWORK_NAME: koljs
  ET_HOSTNAME: github-rdp-easytier
  ET_SOCKS5_PORT: 1080
  ET_PEERS: >-
    -p tcp://south.koljs.dpdns.org:11010
    -p udp://south.koljs.dpdns.org:11010
    -p tcp://mp.koljs.dpdns.org:11010
    -p udp://mp.koljs.dpdns.org:11010
    -p tcp://south.koljs.dpdns.org:11014
    -p udp://south.koljs.dpdns.org:11014

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. 校验输入参数
        shell: pwsh
        run: |
          $hours = [int]"${{ github.event.inputs.session_hours }}"
          if ($hours -lt 1 -or $hours -gt 6) {
            Write-Error "session_hours 必须在 1 到 6 之间"
            exit 1
          }
          Write-Host "会话时长：$hours 小时"

      - name: 2. 开启远程桌面（安全模式）
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $regPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
          Set-ItemProperty -Path $regPath -Name "MaxIdleTime" -Value 900000 -Type DWord
          Write-Host "RDP 已启用，NLA 已开启，空闲 15 分钟自动断开"

      - name: 3. 创建管理员账号
        shell: pwsh
        env:
          RDP_USER: ${{ secrets.RDP_USERNAME }}
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = if ($env:RDP_USER) { $env:RDP_USER } else { "rdpadmin" }
          $password = if ($env:RDP_PASS) { $env:RDP_PASS } else { "P@ss_$(Get-Random -Maximum 99999)" }
          if ($password.Length -lt 8) {
            Write-Error "密码长度至少 8 位"
            exit 1
          }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePass -PasswordNeverExpires -ErrorAction SilentlyContinue | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          net user runneradmin $password | Out-Null
          Write-Host "管理员账号：$username，密码长度：$($password.Length) 位"

      - name: 4. 下载并安装 EasyTier（含参数能力自检）
        shell: pwsh
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          Write-Host "正在获取 EasyTier 最新版本..."
          $release = Invoke-RestMethod "https://api.github.com/repos/EasyTier/EasyTier/releases/latest" -UseBasicParsing -Headers @{ Authorization = "Bearer $env:GH_API_TOKEN" }
          Write-Host "最新版本：$($release.tag_name)"
          $asset = $release.assets | Where-Object {
            $_.name -like "*x86_64*windows*zip" -or
            $_.name -like "*windows*x86_64*zip" -or
            $_.name -like "*x86_64-pc-windows*zip"
          } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "未找到 Windows x86_64 CLI 版本"
            $release.assets | ForEach-Object { Write-Host "  - $($_.name)" }
            exit 1
          }
          Write-Host "下载：$($asset.name) ($([math]::Round($asset.size/1MB, 1)) MB)"
          Invoke-WebRequest $asset.browser_download_url -OutFile "C:\easytier.zip" -UseBasicParsing
          Expand-Archive -Path "C:\easytier.zip" -DestinationPath "C:\easytier" -Force
          $coreExe = Get-ChildItem -Path "C:\easytier" -Recurse -Filter "easytier-core.exe" | Select-Object -First 1
          if (-not $coreExe) {
            Write-Error "解压后未找到 easytier-core.exe"
            exit 1
          }
          Write-Host "EasyTier 安装完成：$($coreExe.FullName)"
          & $coreExe.FullName --version

          Write-Host "===== 关键参数语义自检 ====="
          $helpText = & $coreExe.FullName --help 2>&1 | Out-String
          # 仅 --socks5 是本工作流的硬依赖（方案 A / v8 唯一通道）。
          # 其余参数仅作信息性记录，不作为门禁 —— v8 已不再使用出口节点与 KCP 代理。
          $infoOnly = @("enable-exit-node", "exit-nodes", "manual-routes", "proxy-forward-by-system", "proxy-networks", "enable-kcp-proxy")
          foreach ($k in $infoOnly) {
            if ($helpText -match [regex]::Escape($k)) { Write-Host "  [info] 当前版本支持 --$k（v8 未使用）" }
            else { Write-Host "  [info] 当前版本不支持 --$k（v8 未使用，无影响）" }
          }
          if ($helpText -notmatch "socks5") {
            Write-Error "当前 EasyTier 版本不支持 --socks5，v8（纯 SOCKS5 门户）无法生效，终止。"
            exit 1
          }
          Write-Host "SOCKS5 门户参数可用，v8 前置条件满足。"

      # ======================================================================
      # [v6 关键] 本步骤一次性完成：防火墙 -> 启动 -> 基线自检 -> 就绪校验 ->
      #   门户自检 -> 保活，单步骤持有 easytier-core，避免核心进程跨步骤被回收。
      # [v8] 移除出口节点/KCP 代理；新增出网基线自检、进程优先级、外部心跳。
      # [v8.1] 取消 345 分钟主动收尾，跑满 360 分钟。
      # ======================================================================
      - name: 5. 启动 EasyTier + 出网基线/SOCKS5 自检 + 保活（单一步骤内完成）
        shell: pwsh
        env:
          ET_SECRET: ${{ secrets.EASYTIER_SECRET }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference    = 'SilentlyContinue'
          $jobStart = Get-Date

          # ---------- 全局取值 ----------
          $vip         = $env:ET_VIRTUAL_IP
          $netName     = $env:ET_NETWORK_NAME
          $secret      = $env:ET_SECRET
          $hostname    = $env:ET_HOSTNAME
          $socks5Port  = [int]$env:ET_SOCKS5_PORT
          $octets      = $vip.Split('.')
          $subnet      = "$($octets[0]).$($octets[1]).$($octets[2]).0/24"
          $hours       = [int]"${{ github.event.inputs.session_hours }}"

          if (-not $secret) { Write-Error "未配置 EASYTIER_SECRET"; exit 1 }
          if ($socks5Port -lt 1 -or $socks5Port -gt 65535) { Write-Error "ET_SOCKS5_PORT 非法：$socks5Port"; exit 1 }

          $coreExe  = Get-ChildItem -Path "C:\easytier" -Recurse -Filter "easytier-core.exe" | Select-Object -First 1
          $cliExe   = Get-ChildItem -Path "C:\easytier" -Recurse -Filter "easytier-cli.exe"  | Select-Object -First 1
          $corePath = $coreExe.FullName
          $cliPath  = if ($cliExe) { $cliExe.FullName } else { $null }
          $outLog   = "C:\easytier\out.log"
          $errLog   = "C:\easytier\err.log"
          $restarts = 0

          # 按空白切分后只保留含 "://" 的 token：避免 PowerShell 给含空格的参数加引号后，
          # 首个 peer 被解析成 "-p tcp://..."（旧写法只报废第 1 个节点，组网照通，掩盖了缺陷）
          $peerList = ($env:ET_PEERS -split '\s+') | Where-Object { $_ -match '://' } | ForEach-Object { $_.Trim() }

          # ---------- 诊断辅助函数（全部非致命） ----------
          function Invoke-EtCli {
            param([string[]]$CliArgs, [string]$CliPath)
            if (-not $CliPath) { Write-Host "    (未找到 easytier-cli，跳过)"; return }
            $raw = & $CliPath @CliArgs 2>&1 | Out-String
            $rc  = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            Write-Host (">>> easytier-cli " + ($CliArgs -join ' ') + "   (exit=$rc)")
            if ($raw -and $raw.Trim()) {
              $raw.Trim() -split "`r?`n" | ForEach-Object { Write-Host "    $_" }
            } else {
              Write-Host "    (无输出)"
            }
          }
          function Get-EtPeerCount {
            param([string]$CliPath)
            if (-not $CliPath) { return -1 }
            $o = & $CliPath peer 2>$null | Out-String
            $global:LASTEXITCODE = 0
            return ([regex]::Matches($o, '192\.168\.110\.\d+')).Count
          }
          function Show-CoreLogs {
            param([string]$Out, [string]$Err, [int]$Tail = 30)
            Write-Host "--- core stdout（末 $Tail 行）---"
            if (Test-Path $Out) { Get-Content $Out -Tail $Tail -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  | $_" } }
            Write-Host "--- core stderr（末 $Tail 行）---"
            if (Test-Path $Err) { Get-Content $Err -Tail $Tail -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  | $_" } }
          }
          # [v8] 虚拟网卡（EasyTier 的 TUN）识别
          function Get-TunIndex {
            @(Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object {
                $_.Status -eq 'Up' -and (
                  $_.InterfaceDescription -match 'EasyTier|Wintun|TAP-Windows|WireGuard' -or
                  $_.Name -match 'EasyTier|tun|wintun'
                )
              } | ForEach-Object { $_.ifIndex })
          }
          # [v8] 有效出接口判定：不是「有没有虚拟网卡条目」，而是「内核实际会走哪张网卡」
          function Get-EgressInfo {
            param([string]$Target = '8.8.8.8')
            try {
              $r = @(Find-NetRoute -RemoteIPAddress $Target -ErrorAction SilentlyContinue)
              if ($r.Count -eq 0) { return $null }
              $rt = $r | Where-Object { $_.DestinationPrefix } | Select-Object -Last 1
              if (-not $rt) { $rt = $r | Select-Object -Last 1 }
              return [pscustomobject]@{ Alias = $rt.InterfaceAlias; Index = $rt.InterfaceIndex }
            } catch { return $null }
          }
          function Test-EgressOk {
            # 返回 $true 表示出接口不在虚拟网卡上（安全）
            $eg = Get-EgressInfo -Target '8.8.8.8'
            $tun = @(Get-TunIndex)
            if (-not $eg) { Write-Warning "无法判定出接口（Find-NetRoute 不可用），跳过该项检查"; return $true }
            Write-Host ("   访问 8.8.8.8 的有效出接口：{0} (ifIndex={1})；虚拟网卡 ifIndex：{2}" -f $eg.Alias, $eg.Index, ($(if ($tun.Count) { $tun -join ',' } else { '无' })))
            return (-not ($tun -contains $eg.Index))
          }
          function Set-CorePriority {
            param([string]$Name = 'easytier-core')
            try {
              $p = Get-Process -Name $Name -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($p) { $p.PriorityClass = 'BelowNormal'; Write-Host "已将 $Name 优先级设为 BelowNormal（PID $($p.Id)），保证 Actions 心跳不被抢占。" }
            } catch { Write-Host "（设置进程优先级跳过：$($_.Exception.Message)）" }
          }
          # [v8] 外部心跳：未配置 HEARTBEAT_URL 时静默跳过
          function Send-Heartbeat {
            param([string]$Event = 'tick')
            if (-not $env:HEARTBEAT_URL) { return }
            try {
              $p = Get-Process -Name 'easytier-core' -ErrorAction SilentlyContinue | Select-Object -First 1
              $eg = Get-EgressInfo -Target '8.8.8.8'
              $payload = [ordered]@{
                ts             = (Get-Date).ToUniversalTime().ToString('o')
                event          = $Event
                host           = $hostname
                vip            = $vip
                job_uptime_min = [int]((Get-Date) - $jobStart).TotalMinutes
                peers          = (Get-EtPeerCount -CliPath $cliPath)
                restarts       = $restarts
                socks5_listen  = @(Get-NetTCPConnection -LocalPort $socks5Port -State Listen -ErrorAction SilentlyContinue).Count
                egress_if      = $(if ($eg) { $eg.Alias } else { 'unknown' })
                gh_reachable   = [bool](Test-NetConnection -ComputerName 'api.github.com' -Port 443 -InformationLevel Quiet -WarningAction SilentlyContinue)
                easytier_alive = [bool]$p
                mem_mb         = $(if ($p) { [int]($p.WorkingSet64 / 1MB) } else { 0 })
              }
              $headers = @{ }
              if ($env:HEARTBEAT_TOKEN) { $headers['Authorization'] = "Bearer $($env:HEARTBEAT_TOKEN)" }
              Invoke-RestMethod -Method Post -Uri $env:HEARTBEAT_URL -Headers $headers `
                -ContentType 'application/json; charset=utf-8' -Body ($payload | ConvertTo-Json -Compress) -TimeoutSec 15 | Out-Null
            } catch { Write-Warning "心跳上报失败（不影响会话）：$($_.Exception.Message)" }
          }

          # ---------- A. 防火墙（先做完，后续不再依赖独立步骤） ----------
          Write-Host "===== A. 防火墙：RDP 与 SOCKS5 均只允许来自 EasyTier 网段 ====="
          Disable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Remove-NetFirewallRule  -DisplayName "RDP-EasyTier-Only" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-EasyTier-Only" -Direction Inbound -Protocol TCP `
            -LocalPort 3389 -Action Allow -RemoteAddress $subnet | Out-Null
          Write-Host "已限制：RDP(3389) 仅允许 $subnet"

          # SOCKS5 监听地址在源码层被硬编码为 0.0.0.0，命令行无法收窄，
          # 因此这里用防火墙把入站来源限定在虚拟网段内。
          Remove-NetFirewallRule -DisplayName "EasyTier-SOCKS5" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "EasyTier-SOCKS5" -Direction Inbound -Protocol TCP `
            -LocalPort $socks5Port -Action Allow -RemoteAddress $subnet | Out-Null
          Write-Host "已限制：SOCKS5($socks5Port) 仅允许 $subnet 入站"

          # ---------- B. 清理历史遗留的错误 NetNAT ----------
          Write-Host ""
          Write-Host "===== B. 清理历史脚本遗留的错误 NetNAT ====="
          try {
            $badNat = @(Get-NetNat -ErrorAction SilentlyContinue | Where-Object { $_.InternalIPInterfaceAddressPrefix -eq $subnet })
            if ($badNat.Count -gt 0) {
              foreach ($n in $badNat) { Write-Host "移除：$($n.Name)"; Remove-NetNat -Name $n.Name -Confirm:$false }
            } else {
              Write-Host "未发现与 $subnet 重叠的 NetNAT，无需处理。"
            }
          } catch {
            Write-Host "（NetNat 检查跳过：$($_.Exception.Message)）"
          }

          # ---------- C. 启动 EasyTier（v8：仅 SOCKS5 门户，无出口节点/KCP 代理） ----------
          Write-Host ""
          Write-Host "===== C. 启动 EasyTier（纯 SOCKS5 门户）====="
          $argList = @("-i", $vip, "--network-name", $netName, "--network-secret", $secret, "--hostname", $hostname,
                       "--socks5", "$socks5Port")
          foreach ($p in $peerList) { $argList += "-p"; $argList += $p }
          Write-Host ("启动参数：" + ($argList -join ' '))
          Write-Host "要点：v8 已移除 --enable-exit-node 与 --enable-kcp-proxy（客户端统一走 SOCKS5 门户）；"
          Write-Host "      未指定默认路由，无系统转发 / 无 NetNAT 依赖。"

          $proc = Start-Process -FilePath $corePath -ArgumentList $argList -WindowStyle Hidden -PassThru `
                    -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          Write-Host "PID：$($proc.Id)"
          Set-CorePriority
          Send-Heartbeat 'startup'

          # ---------- C2. 运行器自身出网基线自检（v8 新增，唯一致命项） ----------
          Write-Host ""
          Write-Host "===== C2. 运行器自身出网基线自检 ====="
          if (-not (Test-EgressOk)) {
            Write-Warning "默认路由被虚拟网卡接管 —— 会形成回环并切断 runner 与 GitHub 的连接，尝试修复..."
            foreach ($idx in @(Get-TunIndex)) {
              try {
                Remove-NetRoute -DestinationPrefix '0.0.0.0/0' -InterfaceIndex $idx -Confirm:$false -ErrorAction Stop
                Write-Host "  已删除虚拟网卡 ifIndex=$idx 上的 0.0.0.0/0"
              } catch { Write-Host "  删除失败（ifIndex=$idx）：$($_.Exception.Message)" }
            }
            Start-Sleep -Seconds 3
            if (-not (Test-EgressOk)) {
              Write-Error "修复无效：默认路由仍被虚拟网卡接管，中止以避免跑几小时后失联。"
              Show-CoreLogs -Out $outLog -Err $errLog -Tail 40
              Send-Heartbeat 'egress_broken'
              exit 1
            }
            Write-Host "OK：已修复，默认路由回到物理网卡。"
          } else {
            Write-Host "OK：默认路由归属物理网卡。"
          }

          $ghOk = $false
          for ($i = 1; $i -le 3; $i++) {
            if (Test-NetConnection -ComputerName 'api.github.com' -Port 443 -InformationLevel Quiet -WarningAction SilentlyContinue) { $ghOk = $true; break }
            Start-Sleep -Seconds 5
          }
          if (-not $ghOk) {
            Write-Error "runner 无法访问 api.github.com:443 —— 网络访问被阻断，中止（这正是 lost communication 的典型成因）。"
            Show-CoreLogs -Out $outLog -Err $errLog -Tail 30
            Send-Heartbeat 'github_unreachable'
            exit 1
          }
          Write-Host "OK：api.github.com:443 可达。"

          # ---------- D. 就绪校验 + 稳定性复检 ----------
          $ready = $false
          for ($i = 1; $i -le 45; $i++) {
            Start-Sleep -Seconds 2
            $proc.Refresh()
            if ($proc.HasExited) {
              Write-Host "!! EasyTier 进程意外退出（exit=$($proc.ExitCode)），重启"
              Show-CoreLogs -Out $outLog -Err $errLog -Tail 25
              $proc = Start-Process -FilePath $corePath -ArgumentList $argList -WindowStyle Hidden -PassThru `
                        -RedirectStandardOutput $outLog -RedirectStandardError $errLog
              Set-CorePriority
              Write-Host "重启后 PID：$($proc.Id)"
            }
            if (Get-NetIPAddress -IPAddress $vip -ErrorAction SilentlyContinue) {
              if (-not $cliPath) { $ready = $true; break }
              $pc = Get-EtPeerCount -CliPath $cliPath
              if ($pc -ge 2) {
                Write-Host "虚拟网卡已就绪，IP：$vip；已接入虚拟网络（发现 $pc 个节点）"
                $ready = $true
                break
              }
              Write-Host "网卡已就绪，等待 peer 连接建立（当前可见节点：$pc）..."
            }
          }
          if (-not $ready) {
            Write-Error "EasyTier 未能在 90 秒内接入虚拟网络"
            Show-CoreLogs -Out $outLog -Err $errLog -Tail 60
            Send-Heartbeat 'not_ready'
            exit 1
          }

          # 稳定性复检：确认核心不会在启动后短时间内自行退出
          Write-Host ""
          Write-Host "===== D. 稳定性复检（等待 15 秒）====="
          $stable = $true
          for ($i = 1; $i -le 5; $i++) {
            Start-Sleep -Seconds 3
            $proc.Refresh()
            if ($proc.HasExited) { $stable = $false; Write-Host "!! 进程已退出（exit=$($proc.ExitCode)）"; break }
          }
          if ($stable) { Write-Host "OK：核心进程持续存活，RPC 可达（节点数 $(Get-EtPeerCount -CliPath $cliPath)）" }
          else { Show-CoreLogs -Out $outLog -Err $errLog -Tail 40 }

          # ---------- E. SOCKS5 门户自检（v8 唯一对外通道，全部非致命） ----------
          Write-Host ""
          Write-Host "===== E. SOCKS5 门户自检（v8 唯一对外通道）====="
          $s5listening = $false
          try {
            $listen = @(Get-NetTCPConnection -LocalPort $socks5Port -State Listen -ErrorAction SilentlyContinue)
            if ($listen.Count -gt 0) {
              $addrs = (($listen | Select-Object -ExpandProperty LocalAddress | Sort-Object -Unique) -join ', ')
              Write-Host "OK：已监听 TCP $socks5Port  （绑定地址：$addrs）"
              $s5listening = $true
            } else {
              Write-Warning "未发现 TCP $socks5Port 处于 Listen 状态"
            }
          } catch { Write-Warning "端口检查异常：$($_.Exception.Message)" }

          $portalOk = $false
          if ($s5listening) {
            $curlExe = Join-Path $env:SystemRoot "System32\curl.exe"
            if (Test-Path $curlExe) {
              # --socks5-hostname：域名交给代理远端解析（等价客户端里的 socks5h），
              # 这也是"手机需设私人 DNS 才通"那半个问题的正解。
              $s5raw = & $curlExe -s --max-time 30 --socks5-hostname "127.0.0.1:$socks5Port" "https://api.ipify.org" 2>&1 | Out-String
              $s5rc  = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              $s5out = $s5raw.Trim()
              Write-Host ">>> curl -s --max-time 30 --socks5-hostname 127.0.0.1:$socks5Port https://api.ipify.org   (exit=$s5rc)"
              Write-Host "    返回：$s5out"
              if ($s5rc -eq 0 -and $s5out -match '^\d{1,3}(\.\d{1,3}){3}$') {
                Write-Host "OK：SOCKS5 门户可正常出网，远端出口 IP = $s5out"
                $portalOk = $true
              } else {
                Write-Warning "SOCKS5 门户端到端测试未通过（exit=$s5rc）——端口在听但出网失败，请查看下方 core 日志。"
                Show-CoreLogs -Out $outLog -Err $errLog -Tail 30
              }

              $gRaw = & $curlExe -s -o NUL -w "%{http_code}" --max-time 30 --socks5-hostname "127.0.0.1:$socks5Port" "https://www.google.com/generate_204" 2>&1 | Out-String
              $grc  = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              Write-Host ">>> 经 SOCKS5 访问 google generate_204 -> HTTP $($gRaw.Trim())   (exit=$grc)"
              if ($gRaw.Trim() -eq "204") { Write-Host "OK：经门户访问 Google 成功（HTTP 204）" }
              else { Write-Warning "经门户访问 Google 未返回 204（实际 $($gRaw.Trim())）" }
            } else {
              Write-Warning "未找到 curl.exe，跳过端到端测试"
            }
          }
          if (-not $portalOk) { Send-Heartbeat 'portal_down' }

          # ---------- 本机（出口）出网能力参考 ----------
          Write-Host ""
          Write-Host "--- 本机自身出网能力（客户端置空代理时的对照基线）---"
          try {
            $wanIp = (Invoke-WebRequest -Uri "https://api.ipify.org" -TimeoutSec 20 -UseBasicParsing).Content.Trim()
            Write-Host "本机公网 IP：$wanIp"
          } catch { Write-Warning "获取公网 IP 失败：$($_.Exception.Message)" }
          Invoke-EtCli -CliArgs @("route", "list") -CliPath $cliPath
          Invoke-EtCli -CliArgs @("node", "info")  -CliPath $cliPath
          Invoke-EtCli -CliArgs @("proxy")         -CliPath $cliPath

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  >>> RDP 服务器已就绪！ <<<"
          Write-Host "  EasyTier IP  : $vip"
          Write-Host "  SOCKS5 门户  : socks5h://$vip`:$socks5Port   （v8 唯一对外通道，无认证）"
          Write-Host "  客户端配置   : 出口节点留空；自定义路由留空；代理指向上面地址"
          Write-Host "  连接方式     : mstsc -> 输入 $vip"
          Write-Host "=========================================="

          # ---------- F. 保活（同一进程内看护，不跨步骤） ----------
          # v8.1：不再提前收尾，保活循环跑满 6 小时，到点由平台结束作业。
          $totalMinutes   = $hours * 60
          $lastPeers      = -1
          Write-Host ""
          Write-Host "===== F. 保活运行，计划 $totalMinutes 分钟（跑满 6 小时，看门狗已启用）====="
          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            $elapsed = [int]((Get-Date) - $jobStart).TotalMinutes

            $alive = @(Get-Process -Name "easytier-core" -ErrorAction SilentlyContinue).Count -gt 0
            if (-not $alive) {
              $restarts++
              Write-Host "[$i] !! 检测到 EasyTier 进程退出（累计 $restarts 次），重新启动..."
              Show-CoreLogs -Out $outLog -Err $errLog -Tail 20
              # 复用同一 $argList，保证重启后 --socks5 门户不丢
              Start-Process -FilePath $corePath -ArgumentList $argList -WindowStyle Hidden -PassThru `
                -RedirectStandardOutput $outLog -RedirectStandardError $errLog | Out-Null
              Start-Sleep -Seconds 15
              Set-CorePriority
              Send-Heartbeat 'core_restarted'
            }

            # 每 5 分钟一次轻量采样 + 外部心跳（v8；HEARTBEAT_URL 未配置时自动跳过）
            if ($i % 5 -eq 0) {
              $peers     = Get-EtPeerCount -CliPath $cliPath
              $listenNow = @(Get-NetTCPConnection -LocalPort $socks5Port -State Listen -ErrorAction SilentlyContinue).Count
              Write-Host ("[{0}/{1}] 已运行 {2} 分钟｜节点数：{3}｜SOCKS5({4}) Listen：{5}｜重启：{6}" -f $i, $totalMinutes, $elapsed, $peers, $socks5Port, $listenNow, $restarts)
              $egNow = Get-EgressInfo -Target '8.8.8.8'
              if ($egNow -and (@(Get-TunIndex) -contains $egNow.Index)) {
                Write-Warning "出接口已落到虚拟网卡（$($egNow.Alias)），存在回环风险"
                Send-Heartbeat 'egress_changed'
              } elseif ($listenNow -eq 0) {
                Write-Warning "SOCKS5($socks5Port) 已不在 Listen 状态"
                Send-Heartbeat 'portal_down'
              } elseif ($peers -le 0 -or ($lastPeers -gt 0 -and $peers -lt $lastPeers)) {
                Send-Heartbeat 'peer_anomaly'
              } else {
                Send-Heartbeat 'tick'
              }
              $lastPeers = $peers
            }

            # 每 30 分钟详细快照
            if ($i % 30 -eq 0) {
              Write-Host ("[{0}/{1}] 节点数：{2}  重启次数：{3}" -f $i, $totalMinutes, (Get-EtPeerCount -CliPath $cliPath), $restarts)
              if ($cliPath) {
                Write-Host "  -- route list --"
                (& $cliPath route list 2>&1 | Out-String).Trim() -split "`r?`n" | ForEach-Object { Write-Host "    $_" }
                $global:LASTEXITCODE = 0
                Write-Host "  -- proxy（客户端经门户访问外网后此处应出现 NAT 条目）--"
                (& $cliPath proxy 2>&1 | Out-String).Trim() -split "`r?`n" | ForEach-Object { Write-Host "    $_" }
                $global:LASTEXITCODE = 0
              }
            }
          }
          Write-Host "保活循环已跑满 $totalMinutes 分钟（累计重启 $restarts 次）。"
          exit 0
