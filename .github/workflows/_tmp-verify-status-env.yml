name: TEMP verify status env (auto-deleted)

on:
  workflow_dispatch:

env:
  AGENTDOCK_STATUS_REPO: ${{ secrets.AGENTDOCK_STATUS_REPO || 'dtkluo/agentdock-v2' }}
  AGENTDOCK_STATUS_PATH: ${{ secrets.AGENTDOCK_STATUS_PATH || 'runtime/cloud-desktop.json' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: M1+M2 顶层 env 对 step 可见（step 级未声明同名变量）
        shell: bash
        run: |
          echo "MARK_REPO=[$AGENTDOCK_STATUS_REPO]"
          echo "MARK_PATH=[$AGENTDOCK_STATUS_PATH]"
      - name: 对照：step 级声明为空时会覆盖顶层（说明为何必须删掉那两行）
        shell: bash
        env:
          AGENTDOCK_STATUS_REPO: ${{ secrets.AGENTDOCK_STATUS_REPO }}
        run: |
          echo "MARK_SHADOWED=[$AGENTDOCK_STATUS_REPO]"
