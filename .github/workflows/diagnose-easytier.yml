name: Diagnose EasyTier Connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-easytier.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Runner 网络信息
        run: |
          echo "===== Runner 公网 IP ====="
          curl -s --max-time 10 https://api.ipify.org || echo "获取失败"
          echo ""

      - name: 2. 测试节点 DNS 与 TCP 连通性
        run: |
          for host in south.koljs.dpdns.org mp.koljs.dpdns.org; do
            echo "===== DNS: $host ====="
            getent hosts $host || echo "DNS 解析失败"
            for port in 11010 11014; do
              echo "--- TCP $host:$port ---"
              (timeout 8 bash -c "echo > /dev/tcp/$host/$port" && echo "TCP OK") || echo "TCP FAILED"
            done
          done

      - name: 3. 安装 EasyTier
        run: |
          release=$(curl -s https://api.github.com/repos/EasyTier/EasyTier/releases/latest)
          echo "$release" | grep -o '"tag_name": *"[^"]*"' | head -1
          url=$(echo "$release" | grep -o '"browser_download_url": *"[^"]*linux-x86_64[^"]*\.zip"' | head -1 | sed 's/.*"browser_download_url": *"\([^"]*\)"/\1/')
          echo "下载: $url"
          curl -sL "$url" -o /tmp/et.zip
          cd /tmp && unzip -o et.zip -d easytier
          find /tmp/easytier -name "easytier-core" -o -name "easytier-cli" | head -5

      - name: 4. 查看 EasyTier 可用参数
        run: |
          CORE=$(find /tmp/easytier -name "easytier-core" | head -1)
          $CORE --help 2>&1 || true

      - name: 5. 加入网络并检查节点
        env:
          ET_SECRET: ${{ secrets.EASYTIER_SECRET }}
        run: |
          CORE=$(find /tmp/easytier -name "easytier-core" | head -1)
          CLI=$(find /tmp/easytier -name "easytier-cli" | head -1)
          chmod +x $CORE $CLI
          echo "启动 EasyTier 诊断节点..."
          sudo $CORE -i 192.168.110.99 --network-name koljs --network-secret "$ET_SECRET" --hostname gh-diagnose --enable-exit-node \
            -p tcp://south.koljs.dpdns.org:11010 \
            -p udp://south.koljs.dpdns.org:11010 \
            -p tcp://mp.koljs.dpdns.org:11010 \
            -p udp://mp.koljs.dpdns.org:11010 \
            -p tcp://south.koljs.dpdns.org:11014 \
            -p udp://south.koljs.dpdns.org:11014 \
            > /tmp/et-diag.log 2>&1 &
          sleep 75
          echo "===== 云桌面 .88 连通性测试 ====="
          sudo ping -c 5 -W 3 192.168.110.88 || true
          echo ""
          echo "===== peer 列表（第 1 次采样）====="
          sudo $CLI peer || true
          sleep 60
          echo ""
          echo "===== peer 列表（第 2 次采样）====="
          sudo $CLI peer || true
          echo ""
          echo "===== route 表 ====="
          sudo $CLI route || true
          echo ""
          echo "===== 全局节点列表 ====="
          sudo $CLI global-node || true

      - name: 6. 出口节点端到端测试（经 .88 转发访问外网）
        env:
          ET_SECRET: ${{ secrets.EASYTIER_SECRET }}
        run: |
          CORE=$(find /tmp/easytier -name "easytier-core" | head -1)
          CLI=$(find /tmp/easytier -name "easytier-cli" | head -1)
          # 记录 runner 本机公网 IP（用于对比出口 IP，验证流量确实走了云桌面）
          LOCAL_WAN_IP=$(curl -s --max-time 10 https://api.ipify.org || echo unknown)
          echo "本机公网 IP（未走 VPN）：$LOCAL_WAN_IP"
          # 停掉上一步未配置出口的实例，重启为「客户端」模式：--exit-nodes 指向云桌面 .88
          sudo pkill -f easytier-core || true
          sleep 3
          sudo $CORE -i 192.168.110.99 --network-name koljs --network-secret "$ET_SECRET" --hostname gh-diag-exit-client \
            --exit-nodes 192.168.110.88 \
            -p tcp://south.koljs.dpdns.org:11010 \
            -p udp://south.koljs.dpdns.org:11010 \
            -p tcp://mp.koljs.dpdns.org:11010 \
            -p udp://mp.koljs.dpdns.org:11010 \
            > /tmp/et-exit.log 2>&1 &
          sleep 45
          TUNIF=$(ip -o link show | awk -F': ' '$2 ~ /^tun/ {print $2; exit}')
          echo "TUN 接口：${TUNIF:-未找到}"
          echo ""
          echo "===== peer / route ====="
          sudo $CLI peer || true
          sudo $CLI route || true
          echo ""
          echo "===== 关键步骤：手动接管默认路由（EasyTier exit_nodes 不会自动加路由）====="
          # 用 0/1 + 128/1 覆盖全部 IPv4 且优先级高于原默认路由，不破坏原有路由
          if [ -n "$TUNIF" ]; then
            # 先给 peer 节点公网 IP 加例外（走原网关），否则隧道连接自身被导进 TUN 造成死循环
            DEF_GW=$(ip route show default | awk '{print $3; exit}')
            echo "原默认网关：$DEF_GW"
            for host in south.koljs.dpdns.org mp.koljs.dpdns.org; do
              for pip in $(getent hosts $host | awk '{print $1}' | sort -u); do
                if [ -n "$DEF_GW" ]; then
                  sudo ip route add "$pip/32" via "$DEF_GW" 2>/dev/null || true
                  echo "peer 例外路由：$pip via $DEF_GW"
                fi
              done
            done
            sudo ip route add 0.0.0.0/1 dev "$TUNIF" 2>/dev/null || sudo ip route replace 0.0.0.0/1 dev "$TUNIF"
            sudo ip route add 128.0.0.0/1 dev "$TUNIF" 2>/dev/null || sudo ip route replace 128.0.0.0/1 dev "$TUNIF"
            echo "已添加 0.0.0.0/1 和 128.0.0.0/1 -> $TUNIF"
            sleep 5
            echo "peer 连接状态（确认隧道未被路由切换打断）："
            sudo $CLI peer 2>/dev/null | head -10 || true
          else
            echo "未找到 TUN 接口，跳过路由添加（后续测试将不代表出口节点行为）"
          fi
          echo ""
          echo "===== 当前路由表 ====="
          ip route || true
          echo ""
          echo "===== 测试 0：出口 IP 对比（不同 = 流量确实经云桌面转发）====="
          EXIT_WAN_IP=$(curl -s --max-time 20 https://api.ipify.org || echo unknown)
          echo "经出口节点的公网 IP：$EXIT_WAN_IP"
          if [ "$EXIT_WAN_IP" != "$LOCAL_WAN_IP" ] && [ "$EXIT_WAN_IP" != "unknown" ]; then
            echo ">>> 转发链路验证通过：流量经云桌面 .88 出口 <<<"
          else
            echo ">>> 转发链路验证失败：出口 IP 未变化，流量没有经过云桌面 <<<"
          fi
          echo ""
          echo "===== 测试 A：纯 IP 访问（绕过 DNS，验证转发链路）====="
          curl -s -o /dev/null -w "http://1.1.1.1 -> HTTP %{http_code}，耗时 %{time_total}s\n" --max-time 15 http://1.1.1.1 || echo "1.1.1.1 FAILED"
          curl -s -o /dev/null -w "http://8.8.8.8 -> HTTP %{http_code}，耗时 %{time_total}s\n" --max-time 15 http://8.8.8.8 || echo "8.8.8.8 FAILED"
          echo ""
          echo "===== 测试 B：DNS 解析（查询经出口节点转发）====="
          nslookup -timeout=10 google.com 8.8.8.8 2>&1 || true
          echo ""
          echo "===== 测试 C：完整 HTTPS 访问 Google ====="
          curl -s -o /dev/null -w "https://www.google.com -> HTTP %{http_code}，耗时 %{time_total}s\n" --max-time 20 https://www.google.com || echo "google.com FAILED"
          echo ""
          echo "===== EasyTier 日志（最后 40 行）====="
          tail -40 /tmp/et-exit.log || true
